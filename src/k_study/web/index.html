<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>k_study · Trilhas de estudo</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="view-loading">
<a class="skip-link" href="#main">Ir para o conteúdo</a>
<header class="topbar">
  <button id="menu-btn" class="icon-btn" aria-label="Abrir o menu de aulas" aria-expanded="false" aria-controls="sidebar"></button>
  <a id="home-link" class="brand" href="#/">k_study</a>
  <a id="back-link" class="back-link" href="#/">← Trilhas</a>
  <span id="trail-name" class="trail-name"></span>
  <select id="block-select" aria-label="Bloco da trilha"></select>
  <div class="overall" id="overall">
    <div class="bar" role="progressbar" aria-label="Progresso do bloco" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="overall-fill"></div></div>
    <span id="overall-text"></span>
  </div>
  <div class="user" id="user-box">
    <span class="user-id"><span id="user-name" class="user-name"></span><span id="user-email" class="user-email"></span></span>
    <button id="logout-btn" class="btn small-btn" type="button">Sair</button>
  </div>
</header>
<div class="layout">
  <nav id="sidebar" aria-label="Aulas do bloco"></nav>
  <main id="main" tabindex="-1"><p class="muted">Carregando…</p></main>
</div>
<script src="vendor/marked.min.js"></script>
<script src="app.js"></script>
</body>
</html>
