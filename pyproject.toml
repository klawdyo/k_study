[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k-study"
version = "2.14.0"
description = "Servidor de trilhas de aprendizagem: vídeos, leituras e questões, com progresso por aluno e painel de estatísticas."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []          # somente a biblioteca padrão (sqlite3 incluso)

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
kstudy = "k_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
k_study = ["web/**/*", "admin/web/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
